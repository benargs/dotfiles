# sets 
set -g default-terminal "tmux-256color"
set -g status-position bottom
set -g status-style "bg=#181616,fg=#a6a69c"
set -g status-left "#[fg=#8ba4b0] #S   "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=#c4b28a]^A   ,}#{?pane_in_mode,#[fg=#8ba4b0]copy   ,}#(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null | sed 's/.*/#[fg=#8a9a7b] & /')  #[fg=#949fb5]#(whoami)@#h   #[fg=#c4b28a]%d %b %H:%M "
set -g status-right-length 60
set -g status-interval 15
set -g window-status-format "#[fg=#625e5a]#I #[fg=#a6a69c]#W"
set -g window-status-current-format "#[fg=#c4b28a]#I #[fg=#c5c9c5,underscore]#W#{?window_zoomed_flag,#[fg=#b6927b] +,}"
set -g window-status-separator "   "
set -g message-style "bg=#181616,fg=#c4b28a,fill=#181616"
set -g message-command-style "bg=#181616,fg=#c4b28a,fill=#181616"
set -g mode-style "bg=#282727,fg=#c5c9c5"
set -g pane-border-style "fg=#282727"
set -g pane-active-border-style "fg=#8ba4b0"
set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g prefix C-a
set -s escape-time 1
unbind C-b

set -as terminal-features ",*:RGB"

bind -T copy-mode-vi v send-keys -X begin-selection
# TODO: xclip is under x11 and wl-copy under wayland, but idk more than that
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy -in -selection clipboard'

# nav binds
bind ^ last-window
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind f run-shell "tmux neww ~/.local/bin/sessioniser"
bind s display-popup -E -w 40% -h 40% -b rounded \
  "tmux list-sessions -F '#{?session_attached,* ,  }#S  #{session_windows}w' | fzf --no-info --prompt 'session ' | sed 's/^..//; s/  .*//' | xargs -r tmux switch-client -t"
set -g popup-style "bg=#181616"
set -g popup-border-style "fg=#393836"
set -g detach-on-destroy off
