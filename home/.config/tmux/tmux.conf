# sets 
set -g default-terminal "tmux-256color"
set -g status-bg "#181616"
set -g status-fg "#e6c384"
set -g message-style "bg=#181616,fg=#e6c384"
set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g prefix C-a
set -s escape-time 1
unbind C-b

set -as terminal-features ",*:RGB"

bind -T copy-mode-vi v send-keys -X begin-selection
# TODO: xclip is under x11 and wl-copy under wayland, but idk more than that
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy -in -selection clipboard'

# nav binds
bind ^ last-window
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind f run-shell "tmux neww ~/.local/bin/sessioniser"
set -g detach-on-destroy off
